# Test-server config: serves the pre-built static site. No Node needed at request time.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/balkanwings;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed build files never change, so they can be cached hard.
    location /_astro/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # The PHP login helper only works on the real hosting, not here.
    location ^~ /oauth/ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
